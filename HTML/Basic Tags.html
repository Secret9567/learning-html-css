<!DOCTYPE html>
<html>
    <head><title>Basic Tags in html</title></head>
    <body>
      <!--The use of strong and inserted tags has been done- [<strong>,<ins> respectivly.]-->
        <h1>Basic Tags</h1>
        
      <ins><strong>paragraph-</strong></ins><br> <!-- <ins>...</ins> tags work the same as <p>...</p> tags-->

        <p>A paragraph is a part of a piece of writing that consists of one or more sentences. A paragraph always
         starts on a new line</p>

      <ins><strong>blank row-</strong></ins><br>

        <br>

      <ins><strong>horizontal rule-</strong></ins><br>

        <hr width="50%" size="4" align="right" noshade color="97, 35, 58"><!--for alignment use CSS insted-->
          <!--width defines length, and size defines thickness.-->
          
      <ins><strong>heading levels-</strong></ins><br>
        
        <h1>heading level 1</h1>
        <h2>heading level 2</h2>
        <h3>heading level 3</h3>
        <h4>heading level 4</h4>
        <h5>heading level 5</h5>
        <h6>heading level 6</h6>

    </body>
</html>
