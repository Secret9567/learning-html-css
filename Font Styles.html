<!DOCTYPE html>
<html>
    <head><title>Font Styles</title></head>
    <body>
    <!--If you want to create sample text in vs code then type 'lorem' and press enter-->
        <h1>Font styles</h1>
        <p>This is normal text</p>
        <p>This is <b>bold</b> text.</p>
        <p>This is <u>underlined</u> text.</p><!--It can lso be done using inserted[<ins>...</ins>] tags-->
        <p>This is <i>italic</i> text.</p>
        <p>This is <small>small</small> text.</p>
        <p>This is <big>big</big> text.</p><!--Use CSS instead-->
        <p>This is <sub>subscript</sub> text.</p>
        <p>This is <sup>superscript</sup>text.</p>
        <p>This is <del>deleted</del> text.</p>
        <p>This is <mark>marked</mark> text.</p>
        <marquee direction="right">This is marquee text.</marquee>
    </body>
</html>
